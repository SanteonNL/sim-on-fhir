# Definitions maintained outside this repository: ValueSets and Questionnaires.
#
# Each entry pins one version. Data requirements and dataset definitions refer to
# it by key, for example  code:in={vs:careplan-category}  or
# questionnaire={q:luscii-prems}, and the generator resolves that to the pinned
# canonical below.
#
#   type       ValueSet | Questionnaire
#   source     decor  ART-DECOR (base optional, default the Santeon project san-gen-)
#              nts    Nationale Terminologieserver (base optional, sign-in with
#                     NTS_USERNAME / NTS_PASSWORD)
#              fhir   any other FHIR server (base required)
#   base       server base URL; optional for decor and nts, required for fhir
#   canonical  the canonical URL of the ValueSet or Questionnaire
#   version    the pinned version
#   mode       download  = fetched in the build, so the IG renders it
#              reference = content cannot be downloaded (e.g. a SNOMED ECL query);
#                          only the canonical is used, the terminology server resolves it
#   tokenEnv   optional: name of an environment variable with a bearer token
#
# Maintained with _syncDefinitions.py (add, fetch, check, update); edit by hand when needed.

careplan-category:
  type: ValueSet
  source: decor
  canonical: http://decor.nictiz.nl/fhir/ValueSet/2.16.840.1.113883.2.4.3.11.60.124.11.140--20240925070229
  version: "2024-09-25T07:02:29"
  mode: download

