name: Build and publish IG preview

# Builds the FHIR IG (SUSHI + HL7 IG Publisher) and publishes the result to
# GitHub Pages under a path that identifies where it came from:
#   - push to main            -> https://<org>.github.io/<repo>/
#   - push to another branch  -> https://<org>.github.io/<repo>/<branch-name>/
#   - pull_request into main  -> https://<org>.github.io/<repo>/pr-<number>/
#   - manual run              -> https://<org>.github.io/<repo>/<keyword>/  (via the "keyword" input)
#
# Versioning works like GoReleaser: the git tag is the version. _release.py stamps it
# into sushi-config.yaml before SUSHI runs, so the FHIR package carries it:
#   - tag v0.2.0-rc.1  -> package version 0.2.0-rc.1 -> GitHub pre-release
#   - tag v0.2.0       -> package version 0.2.0      -> GitHub release
#   - any other build  -> package version <base>-snapshot-<sha> (preview only)
# A tag push creates a GitHub Release with the files from dist/ (versioned FHIR package,
# site zip, checksums.txt) instead of publishing a preview folder.
# See "Release process" in README.md for the full branch/tag workflow.

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      keyword:
        description: "Folder to publish under (defaults to the branch/PR name)"
        required: false
        type: string

concurrency:
  group: ig-publish-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Skip PRs from forks: the default GITHUB_TOKEN can't push to gh-pages for those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Download pinned external ValueSets
        run: python3 _syncDefinitions.py fetch

      - name: Check generated definitions are up to date
        run: |
          python3 _generateFromDefinitions.py
          git diff --exit-code -- input/fsh/generated input/pagecontent || {
            echo "::error::Generated files are out of date. Run '_generateFromDefinitions.py' and commit the result."
            exit 1
          }

      - name: Stamp version
        # Tag -> its version (v0.2.0-rc.1 -> 0.2.0-rc.1); otherwise <base>-snapshot-<sha>.
        # Fails on a tag that is not vX.Y.Z or vX.Y.Z-rc.N.
        id: version
        run: python3 _release.py stamp

      - name: Run SUSHI
        run: sushi .

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o input-cache/publisher.jar

      - name: Check terminology server reachability
        id: txcheck
        run: |
          if curl -sSf https://tx.fhir.org > /dev/null; then
            echo "txoption=" >> "$GITHUB_OUTPUT"
          else
            echo "txoption=-tx n/a" >> "$GITHUB_OUTPUT"
          fi

      - name: Run IG Publisher
        # _buildIG.py stops at the first resource the publisher cannot render and at a stalled
        # Jekyll step, and prints the cause; a bare publisher call would hang silently.
        run: python3 _buildIG.py --no-sushi ${{ steps.txcheck.outputs.txoption && '--no-tx' || '' }}

      - name: Package release files
        # dist/: santeon.sim-on-fhir-<version>.tgz, sim-on-fhir_<version>_site.zip, checksums.txt
        run: python3 _release.py dist

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ig-build-log
          path: ig-build.log
          retention-days: 7

      - name: Determine publish folder
        id: slug
        run: |
          if [ -n "${{ inputs.keyword }}" ]; then
            RAW="${{ inputs.keyword }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            RAW=""
          else
            RAW="${{ github.ref_name }}"
          fi
          if [ -z "$RAW" ]; then
            SLUG="."
          else
            SLUG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g')
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Publishing to destination_dir: '$SLUG'"

      - name: Deploy to GitHub Pages
        if: github.ref_type != 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: ${{ steps.slug.outputs.slug }}
          keep_files: true

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: sim-on-fhir-${{ steps.version.outputs.version }}
          path: dist
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build-and-publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: sim-on-fhir-${{ needs.build-and-publish.outputs.version }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: sim-on-fhir ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
