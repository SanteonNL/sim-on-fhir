name: Build and publish IG preview

# Builds the FHIR IG (SUSHI + HL7 IG Publisher) and publishes the result to
# GitHub Pages under a path that identifies where it came from:
#   - push to main            -> https://<org>.github.io/<repo>/
#   - push to another branch  -> https://<org>.github.io/<repo>/<branch-name>/
#   - pull_request into main  -> https://<org>.github.io/<repo>/pr-<number>/
#   - manual run              -> https://<org>.github.io/<repo>/<keyword>/  (via the "keyword" input)
#
# Pushing a tag (v*) additionally creates a GitHub Release with the built IG
# packaged as a zip asset, instead of publishing a preview folder.
#   - v0.2.0-rc.1, v0.2.0-rc.2, ... -> GitHub pre-release
#   - v0.2.0                        -> GitHub release
# See "Release process" in README.md for the full branch/tag workflow.

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      keyword:
        description: "Folder to publish under (defaults to the branch/PR name)"
        required: false
        type: string

concurrency:
  group: ig-publish-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Skip PRs from forks: the default GITHUB_TOKEN can't push to gh-pages for those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches IG version
        if: github.ref_type == 'tag'
        run: |
          IG_VERSION=$(grep -m1 '^version:' sushi-config.yaml | sed -E 's/^version:[[:space:]]*//')
          # Strip the leading 'v' and any '-rc.N' pre-release suffix, e.g. v0.2.0-rc.1 -> 0.2.0
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-rc.*}"
          if [ "$IG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match sushi-config.yaml version $IG_VERSION"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Run SUSHI
        run: sushi .

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o input-cache/publisher.jar

      - name: Check terminology server reachability
        id: txcheck
        run: |
          if curl -sSf https://tx.fhir.org > /dev/null; then
            echo "txoption=" >> "$GITHUB_OUTPUT"
          else
            echo "txoption=-tx n/a" >> "$GITHUB_OUTPUT"
          fi

      - name: Run IG Publisher
        run: |
          export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"
          java -jar input-cache/publisher.jar -ig . ${{ steps.txcheck.outputs.txoption }}

      - name: Determine publish folder
        id: slug
        run: |
          if [ -n "${{ inputs.keyword }}" ]; then
            RAW="${{ inputs.keyword }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            RAW=""
          else
            RAW="${{ github.ref_name }}"
          fi
          if [ -z "$RAW" ]; then
            SLUG="."
          else
            SLUG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+|-+$##g')
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Publishing to destination_dir: '$SLUG'"

      - name: Deploy to GitHub Pages
        if: github.ref_type != 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: ${{ steps.slug.outputs.slug }}
          keep_files: true

      - name: Upload IG output artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output
          retention-days: 1

  release:
    needs: build-and-publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download IG output artifact
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output

      - name: Zip IG output
        run: |
          cd output
          zip -r "../santeon-careplan-ig-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: santeon-careplan-ig-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
